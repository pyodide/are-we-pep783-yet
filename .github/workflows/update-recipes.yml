name: Update pyodide-recipes package list

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  update-recipes:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Refresh the pyodide-recipes package list
        run: make update-recipes

      - name: Commit and push if the list changed
        run: |
          if git diff --quiet -- pyodide-recipes-packages.json; then
            echo "No changes to pyodide-recipes-packages.json"
            exit 0
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyodide-recipes-packages.json
          git commit -m "Refresh pyodide-recipes package list"
          git push
