name: Update pyodide-recipes package list

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-recipes:
    name: Update recipe list
    permissions:
      contents: write # to commit the refreshed package list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Refresh the pyodide-recipes package list
        run: make update-recipes

      - name: Commit and push if the list changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- pyodide-recipes-packages.json; then
            echo "No changes to pyodide-recipes-packages.json"
            exit 0
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyodide-recipes-packages.json
          git commit -m "Refresh pyodide-recipes package list"
          git push
